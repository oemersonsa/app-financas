<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças - Liquid Glass</title>
    
    <!-- Tabler Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Meta tags para PWA -->
    <meta name="theme-color" content="#e8e5f0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <i class="ti ti-wallet header-icon"></i>
                <h1>Finanças</h1>
            </div>
            <div class="header-actions">
                <button class="btn-icon" onclick="exportData()" title="Exportar dados">
                    <i class="ti ti-download"></i>
                </button>
                <button class="btn-icon" onclick="importData()" title="Importar dados">
                    <i class="ti ti-upload"></i>
                </button>
                <button class="btn-icon" onclick="openCategoryModal()" title="Gerenciar categorias">
                    <i class="ti ti-tags"></i>
                </button>
                <button class="btn-icon" onclick="toggleDarkMode()" id="darkModeBtn" title="Alternar tema">
                    <i class="ti ti-moon"></i>
                </button>
                <button class="btn-icon btn-danger" onclick="clearAll()" title="Limpar tudo">
                    <i class="ti ti-trash"></i>
                </button>
            </div>
        </header>

        <!-- Card Principal -->
        <main class="glass-card">
            <!-- Alertas de Vencimento -->
            <div id="alertBanner" class="alert-banner" style="display:none;" onclick="showOverdueTransactions()">
                <i class="ti ti-alert-triangle alert-icon"></i>
                <span id="alertText"></span>
                <i class="ti ti-chevron-right" style="margin-left: auto;"></i>
            </div>

            <!-- Barra de Pesquisa -->
            <div class="search-bar">
                <i class="ti ti-search search-icon"></i>
                <input type="text" id="searchInput" placeholder="Pesquisar transações..." oninput="updateUI()">
            </div>

            <!-- Seletor de Mês -->
            <div class="month-selector">
                <button class="month-nav" onclick="changeMonth(-1)">
                    <i class="ti ti-chevron-left"></i>
                </button>
                <span class="current-month" id="currentMonthDisplay"></span>
                <button class="month-nav" onclick="changeMonth(1)">
                    <i class="ti ti-chevron-right"></i>
                </button>
                <button class="month-nav" onclick="goToToday()" title="Mês atual">
                    <i class="ti ti-calendar"></i>
                </button>
            </div>

            <!-- Saldo -->
            <div class="balance-section">
                <p class="balance-label">Saldo do Mês</p>
                <p class="balance-value" id="balanceDisplay">R$ 0,00</p>
                <p class="balance-subtitle" id="recurringInfo"></p>
            </div>

            <!-- Cards de Resumo -->
            <div class="summary-grid">
                <div class="summary-card summary-income">
                    <i class="ti ti-arrow-up-circle summary-icon"></i>
                    <span class="summary-value" id="totalIncome">R$ 0,00</span>
                    <span class="summary-label">Entradas</span>
                </div>
                <div class="summary-card summary-expense">
                    <i class="ti ti-arrow-down-circle summary-icon"></i>
                    <span class="summary-value" id="totalExpense">R$ 0,00</span>
                    <span class="summary-label">Saídas</span>
                </div>
                <div class="summary-card summary-fixed">
                    <i class="ti ti-file-invoice summary-icon"></i>
                    <span class="summary-value" id="totalFixed">R$ 0,00</span>
                    <span class="summary-label">Contas Fixas</span>
                </div>
                <div class="summary-card summary-subscription">
                    <i class="ti ti-repeat summary-icon"></i>
                    <span class="summary-value" id="totalSubscriptions">R$ 0,00</span>
                    <span class="summary-label">Assinaturas</span>
                </div>
            </div>

            <!-- Gráfico de Pizza -->
            <div class="chart-container" id="chartContainer">
                <h3 class="chart-title">
                    <i class="ti ti-chart-pie"></i>
                    Distribuição de Gastos
                </h3>
                <canvas id="expenseChart" width="250" height="250"></canvas>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" onclick="switchTab('all', this)">
                    <i class="ti ti-list"></i> Todas
                </button>
                <button class="tab" onclick="switchTab('income', this)">
                    <i class="ti ti-arrow-up-circle"></i> Entradas
                </button>
                <button class="tab" onclick="switchTab('expense', this)">
                    <i class="ti ti-arrow-down-circle"></i> Saídas
                </button>
                <button class="tab" onclick="switchTab('fixed', this)">
                    <i class="ti ti-file-invoice"></i> Fixas
                </button>
                <button class="tab" onclick="switchTab('subscription', this)">
                    <i class="ti ti-repeat"></i> Assinaturas
                </button>
            </div>

            <!-- Formulário -->
            <form class="add-form" onsubmit="addTransaction(event)">
                <div class="input-group">
                    <label for="description">
                        <i class="ti ti-file-text"></i> Descrição
                    </label>
                    <input type="text" class="glass-input" id="description" placeholder="Ex: Salário" required>
                </div>
                <div class="input-group">
                    <label for="amount">
                        <i class="ti ti-cash"></i> Valor
                    </label>
                    <input type="number" step="0.01" class="glass-input" id="amount" placeholder="0,00" required>
                </div>
                <div class="input-group">
                    <label for="type">
                        <i class="ti ti-category"></i> Tipo
                    </label>
                    <select class="glass-input" id="type" required onchange="handleTypeChange()">
                        <option value="">Selecione</option>
                        <option value="income">📥 Entrada</option>
                        <option value="expense">📤 Saída</option>
                        <option value="fixed">📋 Conta Fixa</option>
                        <option value="subscription">🔄 Assinatura</option>
                    </select>
                </div>
                <div class="input-group" id="categoryGroup">
                    <label for="category">
                        <i class="ti ti-tag"></i> Categoria
                    </label>
                    <select class="glass-input" id="category">
                        <option value="">Geral</option>
                    </select>
                </div>
                <div class="input-group" id="installmentsGroup" style="display:none;">
                    <label for="installments">
                        <i class="ti ti-stack-2"></i> Parcelas
                    </label>
                    <input type="number" class="glass-input" id="installments" placeholder="1" min="1" max="60" value="1">
                </div>
                <div class="input-group">
                    <label for="date">
                        <i class="ti ti-calendar-event"></i> Data
                    </label>
                    <input type="date" class="glass-input" id="date" required>
                </div>
                <button type="submit" class="glass-button btn-primary">
                    <i class="ti ti-plus"></i> Adicionar
                </button>
            </form>
            
            <div id="installmentNote" style="display:none;" class="info-note">
                <i class="ti ti-info-circle"></i>
                Contas fixas e assinaturas se repetem automaticamente nos próximos meses
            </div>

            <!-- Lista -->
            <ul class="transaction-list" id="transactionList"></ul>
            <div class="empty-state" id="emptyMessage">
                <i class="ti ti-coin-off empty-icon"></i>
                <p>Nenhuma transação neste mês</p>
            </div>
        </main>
    </div>

    <!-- Modal de Edição -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-header">
                <h2>
                    <i class="ti ti-edit"></i> Editar Transação
                </h2>
                <button class="modal-close" onclick="closeModal()">
                    <i class="ti ti-x"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="editDescription">Descrição</label>
                    <input type="text" class="glass-input" id="editDescription">
                </div>
                <div class="form-group">
                    <label>Valor Atual: <strong id="currentValue"></strong></label>
                    <input type="number" step="0.01" class="glass-input" id="editAmount">
                </div>
                <div class="form-group">
                    <label>Ajuste Rápido</label>
                    <div class="adjust-buttons">
                        <button type="button" class="adjust-btn add-adjust" onclick="quickAdjust(10)">
                            <i class="ti ti-plus"></i> R$ 10
                        </button>
                        <button type="button" class="adjust-btn subtract-adjust" onclick="quickAdjust(-10)">
                            <i class="ti ti-minus"></i> R$ 10
                        </button>
                    </div>
                    <div class="adjust-buttons">
                        <button type="button" class="adjust-btn add-adjust" onclick="quickAdjust(50)">
                            <i class="ti ti-plus"></i> R$ 50
                        </button>
                        <button type="button" class="adjust-btn subtract-adjust" onclick="quickAdjust(-50)">
                            <i class="ti ti-minus"></i> R$ 50
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="editType">Tipo</label>
                    <select class="glass-input" id="editType">
                        <option value="income">📥 Entrada</option>
                        <option value="expense">📤 Saída</option>
                        <option value="fixed">📋 Conta Fixa</option>
                        <option value="subscription">🔄 Assinatura</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="editCategory">Categoria</label>
                    <select class="glass-input" id="editCategory">
                        <option value="">Geral</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="editDate">Data</label>
                    <input type="date" class="glass-input" id="editDate">
                </div>
                <div id="editInstallmentInfo" class="installment-info" style="display:none;"></div>
            </div>
            <div class="modal-footer">
                <button class="glass-button btn-success" onclick="saveEdit()">
                    <i class="ti ti-device-floppy"></i> Salvar
                </button>
                <button class="glass-button btn-secondary" onclick="closeModal()">
                    Cancelar
                </button>
            </div>
        </div>
    </div>

    <!-- Modal de Categorias -->
    <div class="modal-overlay" id="categoryModal">
        <div class="modal">
            <div class="modal-header">
                <h2>
                    <i class="ti ti-tags"></i> Gerenciar Categorias
                </h2>
                <button class="modal-close" onclick="closeCategoryModal()">
                    <i class="ti ti-x"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Nova Categoria</label>
                    <div class="input-row">
                        <input type="text" class="glass-input" id="newCategoryName" placeholder="Nome da categoria">
                        <input type="text" class="glass-input" id="newCategoryIcon" placeholder="Ícone" style="max-width: 80px;" maxlength="2">
                    </div>
                    <button class="glass-button btn-primary" onclick="addCategory()" style="width: 100%; margin-top: 8px;">
                        <i class="ti ti-plus"></i> Adicionar Categoria
                    </button>
                </div>
                <div class="form-group">
                    <label>Categorias Existentes</label>
                    <div class="categories-list" id="categoriesList"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="glass-button btn-secondary" onclick="closeCategoryModal()" style="width: 100%;">
                    Fechar
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="app.js"></script>
</body>
</html>
