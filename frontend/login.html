<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#eef3f4" />
  <title>Entrar — Meu bolso</title>
  <link rel="stylesheet" href="/styles/base.css" />
  <link rel="stylesheet" href="/styles/login.css" />
  <script type="module" src="/js/login.js"></script>
  <link rel="stylesheet" href="/styles/theme.css" />
  <script src="/js/theme.js"></script>
</head>
<body>
  <label class="theme-control login-theme">
    <span aria-hidden="true">◐</span>
    <select id="loginTheme" aria-label="Tema"><option value="system">Sistema</option><option value="light">Claro</option><option value="dark">Escuro</option></select>
  </label>
  <main class="login-card">
    <a href="/" class="login-brand" aria-label="Meu bolso">m<span>·</span></a>
    <p class="eyebrow">MEU BOLSO</p>
    <h1>Seu dinheiro,<br /><span>seu espaço.</span></h1>
    <p class="intro">Entre para cuidar das suas finanças com calma.</p>
    <form id="loginForm">
      <label for="username">Usuário</label>
      <input id="username" name="username" autocomplete="username" required maxlength="200" autofocus />
      <label for="password">Senha</label>
      <div class="password-field">
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1000" />
        <button type="button" id="showPassword" aria-controls="password" aria-pressed="false">Mostrar</button>
      </div>
      <label class="remember"><input id="remember" type="checkbox" checked /> Manter conectado por 30 dias</label>
      <p id="loginError" role="alert" hidden></p>
      <button class="login-submit" type="submit">Entrar</button>
    </form>
    <p class="footer-note">Um lugar só seu para organizar o dia a dia.</p>
  </main>
</body>
</html>
