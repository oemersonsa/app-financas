services:
  - type: web
    name: meu-bolso
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build && npm run check && npm test
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: HOST
        value: 0.0.0.0
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: FINANCAS_USER
        value: usuario
      - key: FINANCAS_PASSWORD
        sync: false
